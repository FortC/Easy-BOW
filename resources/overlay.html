<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; height: 100%; }
    canvas { display: block; }

    /* —— 顶部「AI 操作中」状态条（工作中显示，其余区域拦截用户操作） —— */
    #bar {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translate(-50%, -160%);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 7px 10px 7px 16px;
      border-radius: 999px;
      background: rgba(236, 245, 253, 0.88);
      border: 1px solid rgba(110, 162, 235, 0.5);
      box-shadow: 0 6px 22px rgba(82, 132, 218, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-family: 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.22, 1.2, 0.36, 1);
      z-index: 10;
      user-select: none;
      white-space: nowrap;
    }
    #bar.show {
      opacity: 1;
      transform: translate(-50%, 0);
      pointer-events: auto;
    }
    /* 水滴呼吸点：与水波纹主题呼应 */
    #bar .dot {
      position: relative;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #4f86da;
      flex: none;
    }
    #bar .dot::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 1.5px solid rgba(110, 162, 235, 0.75);
      animation: dot-ripple 1.8s ease-out infinite;
    }
    @keyframes dot-ripple {
      0% { transform: scale(0.5); opacity: 1; }
      100% { transform: scale(1.9); opacity: 0; }
    }
    #bar .txt { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
    #bar .txt b { font-size: 13px; font-weight: 600; color: #1e4e8c; letter-spacing: 0.5px; }
    #bar .txt span {
      font-size: 11px;
      color: #5d7ba4;
      max-width: 380px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #btn-pause {
      flex: none;
      font: 600 12px/1 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
      color: #23569c;
      background: rgba(110, 162, 235, 0.16);
      border: 1px solid rgba(110, 162, 235, 0.55);
      border-radius: 999px;
      padding: 6px 14px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
    }
    #btn-pause:hover {
      background: rgba(110, 162, 235, 0.32);
      box-shadow: 0 2px 8px rgba(82, 132, 218, 0.35);
    }
    #btn-pause:active { transform: scale(0.96); }
  </style>
</head>
<body>
  <canvas id="cv"></canvas>
  <div id="bar" aria-hidden="true">
    <span class="dot"></span>
    <div class="txt">
      <b>AI 操作中</b>
      <span id="bar-status">正在处理…</span>
    </div>
    <button id="btn-pause" title="暂停 AI，人工接管操作浏览器">⏸ 暂停</button>
  </div>
  <script>
    ;(function () {
      'use strict'
      var cv = document.getElementById('cv')
      var ctx = cv.getContext('2d')
      var dpr = window.devicePixelRatio || 1

      function resize() {
        cv.width = Math.round(window.innerWidth * dpr)
        cv.height = Math.round(window.innerHeight * dpr)
        cv.style.width = window.innerWidth + 'px'
        cv.style.height = window.innerHeight + 'px'
      }
      window.addEventListener('resize', resize)
      resize()

      // —— 淡蓝色系配色 ——
      var INK = '110, 162, 235'      // 水墨拖尾 / 波纹
      var GLOW = '130, 178, 240'     // 边缘光晕
      var CURSOR = '82, 132, 218'    // 幽灵光标

      var bar = document.getElementById('bar')
      var barStatus = document.getElementById('bar-status')
      document.getElementById('btn-pause').addEventListener('click', function () {
        if (window.easybowOvl) window.easybowOvl.pause()
      })

      var trail = [] // {x, y, t}
      var cursor = null // {x, y}
      var ripples = [] // {x, y, t}
      var ambient = [] // 环境水波 {x, y, t0, dur, maxR}
      var lastAmbient = 0
      var working = false
      var workingT0 = 0
      var needsDraw = true
      var stats = { moves: 0, clicks: 0 }

      function roundRectPath(x, y, w, h, r) {
        ctx.beginPath()
        ctx.moveTo(x + r, y)
        ctx.arcTo(x + w, y, x + w, y + h, r)
        ctx.arcTo(x + w, y + h, x, y + h, r)
        ctx.arcTo(x, y + h, x, y, r)
        ctx.arcTo(x, y, x + w, y, r)
        ctx.closePath()
      }

      /** 环境水波生成（定时器驱动，窗口被遮挡时 rAF 暂停也能持续生成） */
      function spawnAmbient(now) {
        if (ambient.length >= 5) return
        var W = window.innerWidth
        var H = window.innerHeight
        ambient.push({
          x: W * (0.15 + Math.random() * 0.7),
          y: H * (0.15 + Math.random() * 0.7),
          t0: now,
          dur: 6500 + Math.random() * 2500,
          maxR: Math.max(W, H) * (0.5 + Math.random() * 0.3)
        })
      }
      setInterval(function () {
        var now = performance.now()
        if (working && now - lastAmbient > 1500) {
          lastAmbient = now
          spawnAmbient(now)
        }
      }, 300)

      /** AI 工作中：整区淡蓝色遮罩 + 边缘呼吸光晕 + 极轻微环境水波纹 */
      function drawWorkingFrame(now) {
        var W = window.innerWidth
        var H = window.innerHeight
        // 淡蓝色水色遮罩（覆盖层本身拦截用户鼠标，页面此时只允许 AI 经 CDP 操作）
        ctx.fillStyle = 'rgba(' + GLOW + ',0.10)'
        ctx.fillRect(0, 0, W, H)

        // 环境水波：缓慢扩散的大波纹，随机落点，极轻微
        ambient = ambient.filter(function (w) {
          return now - w.t0 < w.dur
        })
        ambient.forEach(function (w) {
          var p = (now - w.t0) / w.dur
          var rad = 20 + p * w.maxR
          var fade = Math.sin(Math.PI * p) // 淡入淡出
          var alpha = 0.085 * fade
          if (alpha < 0.006) return
          ctx.save()
          ctx.strokeStyle = 'rgba(' + GLOW + ',' + alpha.toFixed(4) + ')'
          ctx.lineWidth = 1.3
          ctx.shadowColor = 'rgba(' + GLOW + ',0.35)'
          ctx.shadowBlur = 3
          ctx.beginPath()
          ctx.arc(w.x, w.y, rad, 0, Math.PI * 2)
          ctx.stroke()
          // 第二道随行波（更淡）
          var rad2 = rad * 0.72
          if (rad2 > 24) {
            ctx.strokeStyle = 'rgba(' + GLOW + ',' + (alpha * 0.5).toFixed(4) + ')'
            ctx.beginPath()
            ctx.arc(w.x, w.y, rad2, 0, Math.PI * 2)
            ctx.stroke()
          }
          ctx.restore()
        })

        // 边缘呼吸光晕（两层描边，柔和发光）
        var breath = 0.5 + 0.5 * Math.sin((now - workingT0) / 900)
        var m = 3
        ctx.save()
        ctx.shadowColor = 'rgba(' + GLOW + ',0.8)'
        ctx.shadowBlur = 16
        ctx.strokeStyle = 'rgba(' + GLOW + ',' + (0.22 + breath * 0.2).toFixed(3) + ')'
        ctx.lineWidth = 2
        roundRectPath(m, m, W - m * 2, H - m * 2, 14)
        ctx.stroke()
        ctx.shadowBlur = 26
        ctx.strokeStyle = 'rgba(' + GLOW + ',' + (0.09 + breath * 0.11).toFixed(3) + ')'
        ctx.lineWidth = 6
        roundRectPath(m, m, W - m * 2, H - m * 2, 14)
        ctx.stroke()
        ctx.restore()
      }

      /** 水墨风拖尾：多层淡墨叠染，笔锋随速度与时间收细 */
      function drawTrail(now) {
        trail = trail.filter(function (p) { return now - p.t < 950 })
        if (trail.length < 2) return
        // 平滑曲线控制点
        for (var i = 1; i < trail.length; i++) {
          var a = trail[i - 1]
          var b = trail[i]
          var age = (now - b.t) / 950
          var seg = Math.hypot(b.x - a.x, b.y - a.y)
          var speed = Math.min(1, seg / 26)
          var alpha = Math.pow(1 - age, 1.6) * (0.16 + 0.3 * (1 - speed)) // 慢行墨浓，快行墨淡
          var width = (1.2 + 5.5 * Math.pow(1 - age, 1.3)) * (0.55 + 0.45 * (1 - speed))
          ctx.save()
          ctx.strokeStyle = 'rgba(' + INK + ',' + alpha.toFixed(3) + ')'
          ctx.lineWidth = width
          ctx.lineCap = 'round'
          ctx.shadowColor = 'rgba(' + INK + ',0.55)'
          ctx.shadowBlur = 5
          ctx.beginPath()
          ctx.moveTo(a.x, a.y)
          ctx.lineTo(b.x, b.y)
          ctx.stroke()
          // 侧锋淡染
          ctx.strokeStyle = 'rgba(' + INK + ',' + (alpha * 0.4).toFixed(3) + ')'
          ctx.lineWidth = width * 2.1
          ctx.shadowBlur = 9
          ctx.beginPath()
          ctx.moveTo(a.x, a.y)
          ctx.lineTo(b.x, b.y)
          ctx.stroke()
          ctx.restore()
        }
      }

      /** 水波纹点击涟漪：三圈错落扩散，边缘柔和 */
      function drawRipples(now) {
        ripples = ripples.filter(function (r) { return now - r.t < 1000 })
        ripples.forEach(function (r) {
          for (var k = 0; k < 3; k++) {
            var p = (now - r.t - k * 130) / 850
            if (p < 0 || p > 1) continue
            var rad = 5 + p * (30 + k * 8)
            var alpha = (1 - p) * (0.4 - k * 0.1)
            if (alpha <= 0) continue
            ctx.save()
            ctx.strokeStyle = 'rgba(' + INK + ',' + alpha.toFixed(3) + ')'
            ctx.lineWidth = 1.6
            ctx.shadowColor = 'rgba(' + INK + ',0.7)'
            ctx.shadowBlur = 6
            ctx.beginPath()
            ctx.arc(r.x, r.y, rad, 0, Math.PI * 2)
            ctx.stroke()
            ctx.restore()
          }
          // 落点墨心
          var p0 = (now - r.t) / 400
          if (p0 < 1) {
            ctx.fillStyle = 'rgba(' + INK + ',' + (0.3 * (1 - p0)).toFixed(3) + ')'
            ctx.beginPath()
            ctx.arc(r.x, r.y, 6 * (1 - p0) + 2, 0, Math.PI * 2)
            ctx.fill()
          }
        })
      }

      /** 幽灵光标：柔和小箭头 + 墨点 */
      function drawCursor() {
        if (!cursor) return
        var x = cursor.x
        var y = cursor.y
        ctx.save()
        ctx.translate(x, y)
        ctx.shadowColor = 'rgba(' + CURSOR + ',0.8)'
        ctx.shadowBlur = 7
        ctx.fillStyle = 'rgba(' + CURSOR + ',0.92)'
        ctx.strokeStyle = 'rgba(255,255,255,0.95)'
        ctx.lineWidth = 1.1
        ctx.beginPath()
        ctx.moveTo(0, 0)
        ctx.lineTo(0, 15)
        ctx.lineTo(4.2, 11.2)
        ctx.lineTo(7.2, 17)
        ctx.lineTo(9.8, 15.6)
        ctx.lineTo(6.8, 10)
        ctx.lineTo(11.5, 9.5)
        ctx.closePath()
        ctx.fill()
        ctx.stroke()
        ctx.restore()
        // 笔尖墨点
        ctx.fillStyle = 'rgba(' + INK + ',0.5)'
        ctx.beginPath()
        ctx.arc(x, y, 2.2, 0, Math.PI * 2)
        ctx.fill()
      }

      function draw() {
        if (!needsDraw && !working) return
        if (working) needsDraw = true
        needsDraw = false
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight)
        var now = performance.now()
        if (working) drawWorkingFrame(now)
        drawTrail(now)
        drawRipples(now)
        drawCursor()
      }

      function loop() {
        draw()
        requestAnimationFrame(loop)
      }
      requestAnimationFrame(loop)

      function easeInOut(t) {
        return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2
      }

      window.__ovl = {
        /** 幽灵光标平滑移动到目标点（返回 Promise，动画结束 resolve） */
        moveTo: function (tx, ty) {
          return new Promise(function (resolve) {
            stats.moves++
            var sx = cursor ? cursor.x : Math.max(0, tx - 140)
            var sy = cursor ? cursor.y : Math.max(0, ty - 90)
            var dist = Math.hypot(tx - sx, ty - sy)
            var dur = Math.min(500, Math.max(180, dist * 1.1))
            var t0 = performance.now()
            function step() {
              var t = Math.min(1, (performance.now() - t0) / dur)
              var e = easeInOut(t)
              var x = sx + (tx - sx) * e
              var y = sy + (ty - sy) * e
              cursor = { x: x, y: y }
              trail.push({ x: x, y: y, t: performance.now() })
              needsDraw = true
              if (t < 1) requestAnimationFrame(step)
              else resolve()
            }
            step()
          })
        },
        /** 拖动快速步进：线性快速移动（无慢启动缓动），拖尾实时跟随拖动路径 */
        dragStep: function (tx, ty) {
          return new Promise(function (resolve) {
            stats.moves++
            var sx = cursor ? cursor.x : tx
            var sy = cursor ? cursor.y : ty
            var dur = Math.min(160, Math.max(50, Math.hypot(tx - sx, ty - sy) * 1.4))
            var t0 = performance.now()
            function step() {
              var t = Math.min(1, (performance.now() - t0) / dur)
              var x = sx + (tx - sx) * t
              var y = sy + (ty - sy) * t
              cursor = { x: x, y: y }
              trail.push({ x: x, y: y, t: performance.now() })
              needsDraw = true
              if (t < 1) requestAnimationFrame(step)
              else resolve()
            }
            step()
          })
        },
        /** 水波纹点击涟漪 */
        click: function (x, y) {
          stats.clicks++
          cursor = { x: x, y: y }
          ripples.push({ x: x, y: y, t: performance.now() })
          needsDraw = true
          return Promise.resolve()
        },
        /** AI 工作状态：淡蓝遮罩 + 边缘呼吸光晕 + 顶部「AI 操作中」状态条 */
        setWorking: function (w) {
          working = !!w
          if (working) {
            workingT0 = performance.now()
            // 开启时立即荡开两圈水波
            lastAmbient = performance.now()
            spawnAmbient(performance.now())
            spawnAmbient(performance.now())
            bar.classList.add('show')
          } else {
            bar.classList.remove('show')
          }
          needsDraw = true
          return Promise.resolve(working)
        },
        /** 更新状态条副文本（当前步骤说明） */
        setStatus: function (text) {
          barStatus.textContent = String(text || '')
          return Promise.resolve(barStatus.textContent)
        },
        /** 清空画面（隐藏前调用） */
        clear: function () {
          trail = []
          ripples = []
          cursor = null
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
          ctx.clearRect(0, 0, window.innerWidth, window.innerHeight)
          return Promise.resolve()
        },
        /** 调试：当前动画状态 */
        state: function () {
          return {
            hasCursor: !!cursor,
            x: cursor ? Math.round(cursor.x) : -1,
            y: cursor ? Math.round(cursor.y) : -1,
            trailLen: trail.length,
            rippleCount: ripples.length,
            ambientCount: ambient.length,
            moves: stats.moves,
            clicks: stats.clicks,
            working: working,
            barVisible: bar.classList.contains('show'),
            hasPauseBtn: !!document.getElementById('btn-pause'),
            bridgeOk: !!window.easybowOvl,
            barStatus: barStatus.textContent
          }
        }
      }
    })()
  </script>
</body>
</html>
