<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>模拟常驻连接页</title>
<style>
  body { font-family: system-ui, sans-serif; padding: 24px; background: #fafafa; color: #222; }
  h1 { font-size: 20px; }
  p { color: #555; }
  .panel { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 16px; max-width: 520px; }
  .live { color: #2a7; font-weight: 600; }
  .dot { display: inline-block; width: 10px; height: 10px; margin-right: 6px; border-radius: 50%; background: #2a7; }
  #result { margin-top: 16px; padding: 12px 14px; background: #eef6ff; border: 1px solid #8cf; border-radius: 6px; min-height: 24px; }
</style>
</head>
<body>
<h1>模拟常驻连接页（持续网络活动）</h1>
<p>每 500ms 请求一次本页 URL（打自身文件），制造永不间断的网络活动；页面显示活动计数。</p>

<div class="panel">
  <div class="live"><span class="dot"></span>常驻连接模拟中</div>
  <div style="margin-top:10px">网络活动: <b id="net-count">0</b> 次（每 500ms 一次自请求）</div>
</div>

<div id="result">（结果区）活动计数: 0</div>

<script>
  // 每 500ms fetch 自身 URL：持续网络活动（等价于 WS/SSE 常驻连接的流量特征）
  var n = 0
  function ping() {
    n++
    document.getElementById('net-count').textContent = String(n)
    document.getElementById('result').textContent = '活动计数: ' + n
    fetch(location.pathname + '?ping=' + n, { cache: 'no-store' }).catch(function () {})
  }
  setInterval(ping, 500)
  ping()
</script>
</body>
</html>
