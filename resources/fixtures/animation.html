<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>持续动画 / 倒计时</title>
<style>
  body { font-family: system-ui, sans-serif; padding: 24px; background: #fafafa; color: #222; }
  h1 { font-size: 20px; }
  p { color: #555; }
  .panel { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 16px; max-width: 520px; }
  #counter { font-size: 32px; font-weight: 600; color: #d33; font-variant-numeric: tabular-nums; }
  .bar { height: 12px; margin-top: 12px; border-radius: 6px; background: #eee; overflow: hidden; }
  .bar i {
    display: block; height: 100%; width: 40%;
    background: linear-gradient(90deg, #4a90e2, #7ed3a7);
    animation: slide 1.2s linear infinite; /* 永不结束的 CSS 动画 */
  }
  @keyframes slide {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(250%); }
  }
  .spin {
    display: inline-block; width: 16px; height: 16px; margin-left: 12px;
    border: 3px solid #ccc; border-top-color: #4a90e2; border-radius: 50%;
    animation: rot 0.9s linear infinite;
  }
  @keyframes rot { to { transform: rotate(360deg); } }
  #result { margin-top: 16px; padding: 12px 14px; background: #eef6ff; border: 1px solid #8cf; border-radius: 6px; min-height: 24px; }
</style>
</head>
<body>
<h1>持续动画 / 倒计时页</h1>
<p>requestAnimationFrame 不停改数字 + CSS 动画永不结束（智能等待熔断验证用：页面永远不会「静止」）。</p>

<div class="panel">
  <div>帧计数 <span id="counter">0</span><span class="spin"></span></div>
  <div class="bar"><i></i></div>
</div>

<div id="result">（结果区）动画计数: 0</div>

<script>
  // rAF 循环：数字持续变化，页面永不静止
  var n = 0
  function tick() {
    n++
    document.getElementById('counter').textContent = String(n)
    document.getElementById('result').textContent = '动画计数: ' + n
    requestAnimationFrame(tick)
  }
  requestAnimationFrame(tick)
</script>
</body>
</html>
